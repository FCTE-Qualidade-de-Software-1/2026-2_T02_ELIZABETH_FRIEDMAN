<text x="136" y="130" fill="#555" font-style="italic">Não avaliado: sem nota (ver motivo na tabela)</text>
<text x="122" y="164" text-anchor="end" fill="#1a1a1a">m3-sem-selecao</text>
<g><title>m3-sem-selecao: P95 31,4 ms de L = 1000 ms (3,1%), Excelente (3)</title><rect x="130" y="150" width="11.9" height="20" rx="2" fill="#27ae60"/><rect x="130" y="146" width="12.0" height="28" fill="transparent"/></g>
