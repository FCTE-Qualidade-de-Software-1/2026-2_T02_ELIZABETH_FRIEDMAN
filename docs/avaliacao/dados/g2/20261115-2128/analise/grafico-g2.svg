<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" font-family="sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">P95 de cada cenário de G2 em relação ao limite de aceitação L</title>
<desc id="d">m2-codigo: P95 31,0 ms, L 2000 ms, Excelente (3); m2-nome: P95 30,8 ms, L 2000 ms, Excelente (3); m3-com-selecao: Não avaliado; m3-sem-selecao: P95 31,4 ms, L 1000 ms, Excelente (3); m4-a: P95 649,3 ms, L 10000 ms, Excelente (3); m4-b: P95 700,7 ms, L 10000 ms, Excelente (3); m5-conta: P95 53,0 ms, L 2000 ms, Excelente (3)</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="130" y="18" font-weight="bold" fill="#1a1a1a">P95 de cada cenário em % do limite de aceitação L do cenário</text>
<text x="130" y="34" fill="#555" font-size="11">Menor é melhor. Barra até a linha tracejada = P95 igual a L.</text>
<line x1="130.0" y1="42" x2="130.0" y2="286" stroke="#e3e3e3"/>
<text x="130.0" y="300" text-anchor="middle" fill="#555" font-size="11">0%</text>
<line x1="225.0" y1="42" x2="225.0" y2="286" stroke="#e3e3e3"/>
<text x="225.0" y="300" text-anchor="middle" fill="#555" font-size="11">25%</text>
<line x1="320.0" y1="42" x2="320.0" y2="286" stroke="#e3e3e3"/>
<text x="320.0" y="300" text-anchor="middle" fill="#555" font-size="11">50%</text>
<line x1="415.0" y1="42" x2="415.0" y2="286" stroke="#e3e3e3"/>
<text x="415.0" y="300" text-anchor="middle" fill="#555" font-size="11">75%</text>
<line x1="510.0" y1="42" x2="510.0" y2="286" stroke="#333" stroke-dasharray="4 3"/>
<text x="510.0" y="300" text-anchor="middle" fill="#555" font-size="11">100% (L)</text>
<text x="122" y="62" text-anchor="end" fill="#1a1a1a">m2-codigo</text>
<g><title>m2-codigo: P95 31,0 ms de L = 2000 ms (1,6%), Excelente (3)</title><rect x="130" y="48" width="5.9" height="20" rx="2" fill="#27ae60"/><rect x="130" y="44" width="12.0" height="28" fill="transparent"/></g>
<text x="141.9" y="62" fill="#1a1a1a">31,0 ms · 1,6% de L · Excelente (3)</text>
<text x="122" y="96" text-anchor="end" fill="#1a1a1a">m2-nome</text>
<g><title>m2-nome: P95 30,8 ms de L = 2000 ms (1,5%), Excelente (3)</title><rect x="130" y="82" width="5.9" height="20" rx="2" fill="#27ae60"/><rect x="130" y="78" width="12.0" height="28" fill="transparent"/></g>
<text x="141.9" y="96" fill="#1a1a1a">30,8 ms · 1,5% de L · Excelente (3)</text>
