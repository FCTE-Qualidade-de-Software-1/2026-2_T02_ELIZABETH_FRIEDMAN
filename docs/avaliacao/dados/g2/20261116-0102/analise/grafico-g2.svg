<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" font-family="sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">P95 de cada cenário de G2 em relação ao limite de aceitação L</title>
<desc id="d">m3-com-selecao: P95 33,5 ms, L 1000 ms, Excelente (3); m3-sem-selecao: P95 38,5 ms, L 1000 ms, Excelente (3)</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="130" y="18" font-weight="bold" fill="#1a1a1a">P95 de cada cenário em % do limite de aceitação L do cenário</text>
<text x="130" y="34" fill="#555" font-size="11">Menor é melhor. Barra até a linha tracejada = P95 igual a L.</text>
<line x1="130.0" y1="42" x2="130.0" y2="116" stroke="#e3e3e3"/>
<text x="130.0" y="130" text-anchor="middle" fill="#555" font-size="11">0%</text>
<line x1="225.0" y1="42" x2="225.0" y2="116" stroke="#e3e3e3"/>
<text x="225.0" y="130" text-anchor="middle" fill="#555" font-size="11">25%</text>
<line x1="320.0" y1="42" x2="320.0" y2="116" stroke="#e3e3e3"/>
<text x="320.0" y="130" text-anchor="middle" fill="#555" font-size="11">50%</text>
<line x1="415.0" y1="42" x2="415.0" y2="116" stroke="#e3e3e3"/>
<text x="415.0" y="130" text-anchor="middle" fill="#555" font-size="11">75%</text>
<line x1="510.0" y1="42" x2="510.0" y2="116" stroke="#333" stroke-dasharray="4 3"/>
<text x="510.0" y="130" text-anchor="middle" fill="#555" font-size="11">100% (L)</text>
<text x="122" y="62" text-anchor="end" fill="#1a1a1a">m3-com-selecao</text>
<g><title>m3-com-selecao: P95 33,5 ms de L = 1000 ms (3,4%), Excelente (3)</title><rect x="130" y="48" width="12.7" height="20" rx="2" fill="#27ae60"/><rect x="130" y="44" width="12.7" height="28" fill="transparent"/></g>
<text x="148.7" y="62" fill="#1a1a1a">33,5 ms · 3,4% de L · Excelente (3)</text>
<text x="122" y="96" text-anchor="end" fill="#1a1a1a">m3-sem-selecao</text>
<g><title>m3-sem-selecao: P95 38,5 ms de L = 1000 ms (3,9%), Excelente (3)</title><rect x="130" y="82" width="14.6" height="20" rx="2" fill="#27ae60"/><rect x="130" y="78" width="14.6" height="28" fill="transparent"/></g>
<text x="150.6" y="96" fill="#1a1a1a">38,5 ms · 3,9% de L · Excelente (3)</text>
<rect x="130" y="152" width="10" height="10" fill="#27ae60"/>
<text x="144" y="161" font-size="11" fill="#1a1a1a">Excelente</text>
<rect x="230" y="152" width="10" height="10" fill="#2e86c1"/>
<text x="244" y="161" font-size="11" fill="#1a1a1a">Bom</text>
<rect x="330" y="152" width="10" height="10" fill="#e6a817"/>
<text x="344" y="161" font-size="11" fill="#1a1a1a">Aceitável</text>
<rect x="430" y="152" width="10" height="10" fill="#c0392b"/>
<text x="444" y="161" font-size="11" fill="#1a1a1a">Insatisfatório</text>
</svg>