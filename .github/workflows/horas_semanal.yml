name: Atualizar horas.csv

on:
  schedule:
    - cron: "59 2 * * 1"   # domingo 23:59 em Brasília (UTC-3) = segunda 02:59 UTC
  workflow_dispatch:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: read

concurrency:
  group: horas
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  horas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar horas.csv
        run: python3 scripts/sync_horas_csv.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gestao/evidencias/horas.csv
          git diff --cached --quiet || git commit -m "chore: atualização do horas.csv"
          git pull --rebase
          git push