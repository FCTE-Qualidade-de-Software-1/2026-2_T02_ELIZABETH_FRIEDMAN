name: Publicar GitPage

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "59 2 * * 1" # domingo 23:59 em Brasília
  issues:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para as datas de "última atualização"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar métricas PSM/CID
        run: python3 scripts/coletar_metricas_psm.py
        continue-on-error: true # se a API do GitHub falhar, publica com os dados já commitados
        env:
          GH_TOKEN: ${{ github.token }}
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
